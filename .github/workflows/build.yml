name: Build and release Windows installer

# Runs whenever package.json changes on main (a version bump), or by hand from the Actions tab.
# Builds the installer, then publishes/updates the GitHub release v<version> with the installer,
# latest.yml and the blockmap, which is what installed copies read to auto-update.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build installer
        run: npx electron-builder --win nsis --publish never
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Atomax Media Office v${{ steps.ver.outputs.version }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          fail_on_unmatched_files: true
      - uses: actions/upload-artifact@v4
        with:
          name: Atomax-Media-Office-Setup
          path: dist/*.exe
