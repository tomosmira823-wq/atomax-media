name: Build and release Windows installer

# Runs whenever package.json changes on main (i.e. a version bump), on a v* tag, or by hand from the Actions tab.
# electron-builder creates the GitHub release named v<version> itself and uploads the installer, latest.yml and blockmap,
# which is what installed copies read to auto-update.
on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build and publish release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Atomax-Media-Office-Setup
          path: dist/*.exe
