name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # on a v* tag: build and publish the release (installer + latest.yml + blockmap) so installed copies auto-update
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build only (manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Atomax-Media-Office-Setup
          path: dist/*.exe
